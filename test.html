
<!DOCTYPE html>
<html lang="en">

<head>
<meta name="robots" content="noindex, nofollow">

    <meta charset="UTF-8">

    <!-- Makes the website fit properly on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>access.dev.page</title>

    <style>

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            margin-top: 50px;
            padding: 10px;
        }

        #errorTxt {
            color: red;
            font-weight: bold;
        }

        #devPanel {
            display: none;
        }

        input {
            padding: 12px;
            font-size: 16px;
            width: 80%;
            max-width: 300px;
        }

        button {
            padding: 12px 20px;
            font-size: 16px;
            margin: 8px;
            cursor: pointer;
        }

        #timer {
            font-size: 30px;
        }


        /* PHONE */

        @media (max-width: 600px) {

            body {
                margin-top: 30px;
            }

            h1 {
                font-size: 28px;
            }

            h2 {
                font-size: 22px;
            }

            button {
                display: block;
                margin: 10px auto;
                width: 80%;
                max-width: 300px;
            }

            input {
                width: 90%;
            }

        }

    </style>

</head>


<body>


    <!-- PASSWORD PAGE -->

    <div id="passwordGate">

        <h2>password.access</h2>

        <!-- TEXT means you can SEE the password -->
        <input
            type="text"
            id="passwordInput"
            placeholder="password"
        >

        <br>

        <button id="submitPassword">
            Enter
        </button>

        <p id="errorTxt"></p>

    </div>


    <!-- DEVELOPER PANEL -->

    <div id="devPanel">

        <h1>Developer Panel</h1>

        <button id="start">
            START
        </button>

        <button id="stop">
            STOP
        </button>

        <h2 id="timer">
            00:00:10
        </h2>


        <input
            type="text"
            placeholder="name"
            id="txtname"
        >

        <button
            id="btnname"
            onclick="printname()"
        >
            Put your name
        </button>

        <p id="nameResult"></p>

    </div>


    <!-- SOUND -->

    <audio id="kitenmeyaw">

        <source
            src="Meow.ogg"
            type="audio/ogg"
        >

    </audio>


    <script>


        // Get things from HTML

        var passwordInput =
            document.getElementById("passwordInput");

        var submitPassword =
            document.getElementById("submitPassword");

        var errorTxt =
            document.getElementById("errorTxt");

        var passwordGate =
            document.getElementById("passwordGate");

        var devPanel =
            document.getElementById("devPanel");

        var startButton =
            document.getElementById("start");

        var stopButton =
            document.getElementById("stop");

        var timerDisplay =
            document.getElementById("timer");

        var catSound =
            document.getElementById("kitenmeyaw");


        // Timer

        var timeLeft = 10;

        var countdownTimer;


        // PASSWORD

        submitPassword.onclick = function () {

            var secretPassword =
                "Gh1K99Y2015HiopLpNhMasE";


            if (passwordInput.value == secretPassword) {

                devPanel.style.display = "block";

                passwordGate.style.display = "none";

            }

            else {

                errorTxt.innerHTML =
                    "Err.access.denied";

                passwordInput.value = "";

            }

        };


        // START BUTTON

        startButton.onclick = function () {

            timeLeft = 10;

            timerDisplay.innerHTML =
                "00:00:10";


            countdownTimer = setInterval(function () {

                timeLeft = timeLeft - 1;


                if (timeLeft > 0) {

                    if (timeLeft < 10) {

                        timerDisplay.innerHTML =
                            "00:00:0" + timeLeft;

                    }

                    else {

                        timerDisplay.innerHTML =
                            "00:00:" + timeLeft;

                    }

                }


                if (timeLeft <= 0) {

                    clearInterval(countdownTimer);

                    timerDisplay.innerHTML =
                        "00:00:00";

                    catSound.play();

                }

            }, 1000);

        };


        // STOP BUTTON

        stopButton.onclick = function () {

            clearInterval(countdownTimer);

            catSound.pause();

            catSound.currentTime = 0;

            timeLeft = 10;

            timerDisplay.innerHTML =
                "00:00:10";

        };


        // NAME BUTTON

        function printname() {

            let txtname =
                document.getElementById("txtname");

            let name =
                txtname.value;


            if (name == "") {

                name = "Tester";

            }


            document.getElementById("nameResult").innerHTML =
                "Hello, " + name + "!";

        }

    </script>

</body>

</html>
